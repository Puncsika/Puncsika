name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Puncsika
          outputs: |
            dist/github-snake.svg?color_snake=#c9a84c&color_dots=#0a0806,#15110d,#8b7634,#c9a84c,#dfc06a
            dist/github-snake-dark.svg?color_snake=#c9a84c&color_dots=#0a0806,#15110d,#8b7634,#c9a84c,#dfc06a

      - name: Push to output branch
        run: |
          cd dist
          git init -b output
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update snake animation"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Puncsika/Puncsika.git
          git push -f origin output
